<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">The Spin(2,3) mathematical spine</title><desc id="d">Coupled measurements form a positive response cone, Jordan recursion and TKK closure, followed by a firewall before physical spacetime.</desc><rect width="1200" height="520" fill="#f6f0e6"/><g font-family="Segoe UI,Arial" fill="#172321"><text x="60" y="65" font-size="25" font-weight="700">FROM MEASUREMENT TO THE HINGE</text><text x="60" y="98" font-size="17" fill="#5c655f">Every arrow preserves a declared object; the final dashed arrow remains unproved.</text></g><g stroke="#1f6866" stroke-width="5" fill="none"><path d="M180 270H340M460 270H620M740 270H900"/><path d="M1020 270H1110" stroke="#ad4d34" stroke-dasharray="12 12"/></g><g font-family="Segoe UI,Arial" text-anchor="middle"><g><rect x="60" y="180" width="240" height="180" rx="20" fill="#fffaf1" stroke="#b8aea0"/><text x="180" y="225" font-size="20" font-weight="700" fill="#172321">Coupled signals</text><text x="180" y="260" font-size="16" fill="#5c655f">two self-responses</text><text x="180" y="285" font-size="16" fill="#5c655f">one cross-response</text><circle cx="145" cy="320" r="17" fill="#ad4d34"/><circle cx="215" cy="320" r="17" fill="#1f6866"/><path d="M162 320H198" stroke="#9b6d20" stroke-width="8"/></g><g><rect x="340" y="180" width="240" height="180" rx="20" fill="#fffaf1" stroke="#b8aea0"/><text x="460" y="225" font-size="20" font-weight="700" fill="#172321">H₂(ℝ) positive cone</text><text x="460" y="260" font-size="16" fill="#5c655f">symmetric 2 × 2 responses</text><path d="M410 330L460 245 510 330Z" fill="#1f6866" opacity=".22" stroke="#1f6866" stroke-width="4"/></g><g><rect x="620" y="180" width="240" height="180" rx="20" fill="#fffaf1" stroke="#b8aea0"/><text x="740" y="225" font-size="20" font-weight="700" fill="#172321">Jordan triple + TKK</text><text x="740" y="260" font-size="16" fill="#5c655f">eliminate · update · prolong</text><path d="M690 315q50-80 100 0M690 315q50 55 100 0" fill="none" stroke="#ad4d34" stroke-width="5"/></g><g><rect x="900" y="180" width="240" height="180" rx="20" fill="#fffaf1" stroke="#1f6866" stroke-width="4"/><text x="1020" y="225" font-size="20" font-weight="700" fill="#172321">𝔰𝔭(4,ℝ) ≅ 𝔰𝔭𝔦𝔫(2,3)</text><text x="1020" y="260" font-size="16" fill="#5c655f">ten generators</text><text x="1020" y="288" font-size="16" fill="#5c655f">exact model theorem</text><circle cx="1020" cy="325" r="26" fill="none" stroke="#9b6d20" stroke-width="6"/><path d="M994 325H1046M1020 299V351" stroke="#9b6d20" stroke-width="4"/></g></g><rect x="1090" y="120" width="70" height="300" fill="#ad4d34" opacity=".1"/><text x="1125" y="450" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#ad4d34">PHYSICAL FIREWALL</text></svg>
