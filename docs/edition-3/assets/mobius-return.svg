<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">One and two circuits of a half-twisted loop</title><desc id="d">An oriented marker reverses after one circuit of a half-twisted track and returns after two circuits.</desc><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#ad4d34"/></marker></defs><rect width="1200" height="520" fill="#f6f0e6"/><g font-family="Segoe UI,Arial"><text x="60" y="58" font-size="25" font-weight="700" fill="#172321">A HALF-TWIST CHANGES THE RETURN RULE</text><text x="60" y="91" font-size="17" fill="#5c655f">The strip is an analogy for projective bookkeeping, not an extra physical dimension.</text><g transform="translate(60 135)"><path d="M70 130C70 20 420 20 420 130S70 240 70 130" fill="none" stroke="#d8c9b7" stroke-width="48"/><path d="M70 130C70 20 420 20 420 130S70 240 70 130" fill="none" stroke="#172321" stroke-width="3"/><path d="M225 55L270 205M270 55L225 205" stroke="#9b6d20" stroke-width="8" opacity=".75"/><path d="M93 100C155 28 335 28 397 100" fill="none" stroke="#ad4d34" stroke-width="5" marker-end="url(#ma)"/><path d="M95 130V75M88 84L95 75 102 84" fill="none" stroke="#1f6866" stroke-width="6"/><path d="M397 130V185M390 176L397 185 404 176" fill="none" stroke="#ad4d34" stroke-width="6"/><text x="245" y="280" text-anchor="middle" font-size="23" font-weight="700" fill="#ad4d34">one circuit: ↑ becomes ↓</text><text x="245" y="310" text-anchor="middle" font-size="15" fill="#5c655f">same base position, opposite marked orientation</text></g><g transform="translate(650 135)"><path d="M70 130C70 20 420 20 420 130S70 240 70 130" fill="none" stroke="#d8c9b7" stroke-width="48"/><path d="M70 130C70 20 420 20 420 130S70 240 70 130" fill="none" stroke="#172321" stroke-width="3"/><path d="M225 55L270 205M270 55L225 205" stroke="#9b6d20" stroke-width="8" opacity=".75"/><path d="M92 92C170 8 365 45 405 120C440 190 275 248 125 205C45 182 45 96 93 72" fill="none" stroke="#1f6866" stroke-width="5" marker-end="url(#ma)"/><path d="M95 130V75M88 84L95 75 102 84" fill="none" stroke="#1f6866" stroke-width="6"/><path d="M397 130V75M390 84L397 75 404 84" fill="none" stroke="#1f6866" stroke-width="6"/><text x="245" y="280" text-anchor="middle" font-size="23" font-weight="700" fill="#1f6866">two circuits: ↑ returns to ↑</text><text x="245" y="310" text-anchor="middle" font-size="15" fill="#5c655f">the complete marked state closes</text></g></g></svg>
