<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Terminal research gate partition</title><desc id="d">A5 and A7 are internally exhausted, A2 and A9 are conditionally constructed, A4 A6 and A11 are externally open, and the graph lane is a separate conditional response route.</desc><rect width="1200" height="650" fill="#f6f0e6"/><g font-family="Segoe UI,Arial"><text x="70" y="60" font-size="25" font-weight="700" fill="#172321">WHERE NEW INFORMATION MUST ENTER</text><text x="70" y="94" font-size="17" fill="#5c655f">No whole gate has globally failed. Physical admission remains false.</text><g transform="translate(70 140)"><rect width="320" height="360" rx="24" fill="#ad4d34" opacity=".12" stroke="#ad4d34" stroke-width="4"/><text x="30" y="48" font-size="19" font-weight="700" fill="#ad4d34">INTERNALLY EXHAUSTED</text><text x="30" y="92" font-size="30" font-weight="700" fill="#172321">A5 · Selector</text><text x="30" y="126" font-size="15" fill="#5c655f">needs a physical phase reference</text><text x="30" y="190" font-size="30" font-weight="700" fill="#172321">A7 · Stress</text><text x="30" y="224" font-size="15" fill="#5c655f">needs curved microscopic matching</text><text x="30" y="304" font-size="16" fill="#172321">Do not recombine the same inputs.</text></g><g transform="translate(440 140)"><rect width="320" height="360" rx="24" fill="#9b6d20" opacity=".12" stroke="#9b6d20" stroke-width="4"/><text x="30" y="48" font-size="19" font-weight="700" fill="#9b6d20">CONDITIONALLY BUILT</text><text x="30" y="92" font-size="30" font-weight="700" fill="#172321">A2 · Defect</text><text x="30" y="126" font-size="15" fill="#5c655f">neutral wall + localized reader</text><text x="30" y="190" font-size="30" font-weight="700" fill="#172321">A9 · Response</text><text x="30" y="224" font-size="15" fill="#5c655f">positive toy spectrum + fit protocol</text><text x="30" y="304" font-size="16" fill="#172321">Named external inputs remain.</text></g><g transform="translate(810 140)"><rect width="320" height="360" rx="24" fill="#1f6866" opacity=".12" stroke="#1f6866" stroke-width="4"/><text x="30" y="48" font-size="19" font-weight="700" fill="#1f6866">EXTERNALLY OPEN</text><text x="30" y="92" font-size="30" font-weight="700" fill="#172321">A4 · States</text><text x="30" y="150" font-size="30" font-weight="700" fill="#172321">A6 · Families</text><text x="30" y="208" font-size="30" font-weight="700" fill="#172321">A11 · Experiment</text><text x="30" y="260" font-size="15" fill="#5c655f">domain · anomaly-free parent · signal</text><text x="30" y="304" font-size="16" fill="#172321">New physics or data could reopen them.</text></g></g><rect x="250" y="555" width="700" height="55" rx="27" fill="#172321"/><text x="600" y="590" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#f6f0e6">GRAPH LANE: conditional response symmetry — not spacetime</text></svg>
