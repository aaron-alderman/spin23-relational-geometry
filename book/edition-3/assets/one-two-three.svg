<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">One, two and three relational roles</title><desc id="d">One carrier supports a state, two faces permit comparison, and three relations form the first consistency loop.</desc><rect width="1200" height="520" fill="#f6f0e6"/><g font-family="Segoe UI,Arial" text-anchor="middle"><text x="600" y="58" font-size="25" font-weight="700" fill="#172321">ONE HOLDS · TWO COMPARE · THREE TEST CLOSURE</text><g transform="translate(80 130)"><circle cx="150" cy="150" r="100" fill="#ad4d34" opacity=".18" stroke="#ad4d34" stroke-width="5"/><text x="150" y="145" font-size="62" fill="#ad4d34">1</text><text x="150" y="190" font-size="18" fill="#172321">carrier</text><text x="150" y="225" font-size="15" fill="#5c655f">a place for state</text></g><g transform="translate(390 130)"><circle cx="95" cy="150" r="65" fill="#1f6866" opacity=".18" stroke="#1f6866" stroke-width="5"/><circle cx="205" cy="150" r="65" fill="#1f6866" opacity=".18" stroke="#1f6866" stroke-width="5"/><path d="M160 150H140" stroke="#9b6d20" stroke-width="9"/><text x="150" y="285" font-size="18" fill="#172321">two faces compare</text><text x="150" y="315" font-size="15" fill="#5c655f">one cross-channel</text></g><g transform="translate(760 105)"><path d="M150 35L35 245H265Z" fill="#9b6d20" opacity=".12" stroke="#9b6d20" stroke-width="6"/><circle cx="150" cy="35" r="28" fill="#fffaf1" stroke="#172321" stroke-width="4"/><circle cx="35" cy="245" r="28" fill="#fffaf1" stroke="#172321" stroke-width="4"/><circle cx="265" cy="245" r="28" fill="#fffaf1" stroke="#172321" stroke-width="4"/><path d="M145 70L65 215M70 245H230M235 215L155 70" stroke="#1f6866" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6Z" fill="#1f6866"/></marker></defs><text x="150" y="315" font-size="18" fill="#172321">first closed loop</text><text x="150" y="345" font-size="15" fill="#5c655f">return may carry a defect</text></g></g></svg>
