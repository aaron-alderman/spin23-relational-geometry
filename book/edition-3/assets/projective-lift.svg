<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">From a frustrated triangle to its marked double lift</title><desc id="d">A three-cycle with nontrivial return sign lifts to a connected six-cycle; retaining every mark can require a twelve-step return.</desc><defs><marker id="pa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#1f6866"/></marker></defs><rect width="1200" height="620" fill="#f6f0e6"/><g font-family="Segoe UI,Arial"><text x="55" y="55" font-size="25" font-weight="700" fill="#172321">ONE OBSTRUCTION · THREE LEVELS OF BOOKKEEPING</text><text x="55" y="88" font-size="17" fill="#5c655f">The cover changes how return data are recorded; it does not manufacture chirality.</text><g transform="translate(45 125)"><rect width="350" height="430" rx="18" fill="#fffaf1" stroke="#b8aea0"/><text x="24" y="42" font-size="18" font-weight="700" fill="#ad4d34">1 · BASE CYCLE C₃</text><path d="M175 90L65 285H285Z" fill="#ad4d34" opacity=".08" stroke="#172321" stroke-width="4"/><path d="M170 105L82 265M92 285H258M268 263L183 108" fill="none" stroke="#1f6866" stroke-width="5" marker-end="url(#pa)"/><g fill="#fffaf1" stroke="#172321" stroke-width="4"><circle cx="175" cy="90" r="24"/><circle cx="65" cy="285" r="24"/><circle cx="285" cy="285" r="24"/></g><g text-anchor="middle" font-size="16" font-weight="700" fill="#172321"><text x="175" y="96">1</text><text x="65" y="291">2</text><text x="285" y="291">3</text></g><g text-anchor="middle" font-size="16" fill="#9b6d20"><text x="105" y="185">+</text><text x="175" y="312">+</text><text x="245" y="185">−</text></g><text x="175" y="365" text-anchor="middle" font-size="21" font-weight="700" fill="#ad4d34">loop return = −I</text><text x="175" y="397" text-anchor="middle" font-size="15" fill="#5c655f">pairwise rules are local;</text><text x="175" y="419" text-anchor="middle" font-size="15" fill="#5c655f">the closed product stores the defect</text></g><g transform="translate(425 125)"><rect width="350" height="430" rx="18" fill="#fffaf1" stroke="#b8aea0"/><text x="24" y="42" font-size="18" font-weight="700" fill="#9b6d20">2 · CONNECTED DOUBLE COVER C₆</text><path d="M175 80L270 135 270 245 175 300 80 245 80 135Z" fill="#9b6d20" opacity=".08" stroke="#172321" stroke-width="4"/><g fill="#fffaf1" stroke-width="4"><circle cx="175" cy="80" r="22" stroke="#1f6866"/><circle cx="270" cy="135" r="22" stroke="#ad4d34"/><circle cx="270" cy="245" r="22" stroke="#1f6866"/><circle cx="175" cy="300" r="22" stroke="#ad4d34"/><circle cx="80" cy="245" r="22" stroke="#1f6866"/><circle cx="80" cy="135" r="22" stroke="#ad4d34"/></g><g text-anchor="middle" font-size="15" font-weight="700" fill="#172321"><text x="175" y="86">1+</text><text x="270" y="141">2−</text><text x="270" y="251">3+</text><text x="175" y="306">1−</text><text x="80" y="251">2+</text><text x="80" y="141">3−</text></g><text x="175" y="365" text-anchor="middle" font-size="21" font-weight="700" fill="#9b6d20">sheet parity is explicit</text><text x="175" y="397" text-anchor="middle" font-size="15" fill="#5c655f">one turn exchanges sheets;</text><text x="175" y="419" text-anchor="middle" font-size="15" fill="#5c655f">two turns close the lifted position</text></g><g transform="translate(805 125)"><rect width="350" height="430" rx="18" fill="#fffaf1" stroke="#b8aea0"/><text x="24" y="30" font-size="18" font-weight="700" fill="#1f6866">3 · MARKED RETURN C₁₂</text><circle cx="175" cy="190" r="113" fill="#1f6866" opacity=".06" stroke="#172321" stroke-width="4"/><g fill="#fffaf1" stroke="#1f6866" stroke-width="3"><circle cx="175" cy="77" r="13"/><circle cx="232" cy="92" r="13"/><circle cx="273" cy="133" r="13"/><circle cx="288" cy="190" r="13"/><circle cx="273" cy="247" r="13"/><circle cx="232" cy="288" r="13"/><circle cx="175" cy="303" r="13"/><circle cx="118" cy="288" r="13"/><circle cx="77" cy="247" r="13"/><circle cx="62" cy="190" r="13"/><circle cx="77" cy="133" r="13"/><circle cx="118" cy="92" r="13"/></g><g text-anchor="middle" font-size="11" font-weight="700" fill="#172321"><text x="175" y="81">0</text><text x="232" y="96">1</text><text x="273" y="137">2</text><text x="288" y="194">3</text><text x="273" y="251">4</text><text x="232" y="292">5</text><text x="175" y="307">6</text><text x="118" y="292">7</text><text x="77" y="251">8</text><text x="62" y="194">9</text><text x="77" y="137">10</text><text x="118" y="96">11</text></g><path d="M175 55A135 135 0 1 1 160 56" fill="none" stroke="#ad4d34" stroke-width="4" marker-end="url(#pa)"/><text x="175" y="365" text-anchor="middle" font-size="21" font-weight="700" fill="#1f6866">all marks return</text><text x="175" y="397" text-anchor="middle" font-size="15" fill="#5c655f">position, sheet and decoration</text><text x="175" y="419" text-anchor="middle" font-size="15" fill="#5c655f">can require twelve transport steps</text></g></g></svg>
