<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Four distinct Standard Model gates</title><desc id="d">A staircase separates parameter fitting, healthy poles, a chiral domain, index three and anomaly cancellation.</desc><rect width="1200" height="600" fill="#f6f0e6"/><g font-family="Segoe UI,Arial"><text x="70" y="65" font-size="25" font-weight="700" fill="#172321">A FIT IS NOT YET A DERIVATION</text><text x="70" y="98" font-size="17" fill="#5c655f">Each higher step needs a new kind of evidence.</text><g transform="translate(80 150)"><path d="M0 360H210V280H420V200H630V120H840V40H1040" fill="none" stroke="#172321" stroke-width="7"/><g font-size="18" font-weight="700" fill="#172321"><text x="105" y="330" text-anchor="middle">Fit SM parameters</text><text x="315" y="250" text-anchor="middle">Healthy poles</text><text x="525" y="170" text-anchor="middle">Chiral domain</text><text x="735" y="90" text-anchor="middle">Index three</text><text x="940" y="20" text-anchor="middle">Anomaly-free parent</text></g><g font-size="15" fill="#5c655f"><text x="105" y="385" text-anchor="middle">capacity</text><text x="315" y="305" text-anchor="middle">local benchmark</text><text x="525" y="225" text-anchor="middle">currently missing</text><text x="735" y="145" text-anchor="middle">constructed</text><text x="940" y="65" text-anchor="middle">currently missing</text></g><circle cx="525" cy="200" r="16" fill="#ad4d34"/><circle cx="940" cy="40" r="16" fill="#ad4d34"/><circle cx="735" cy="120" r="16" fill="#1f6866"/></g></g></svg>
