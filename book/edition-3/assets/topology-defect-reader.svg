<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="t d"><title id="t">Topological memory, defect wall and localized reader</title><desc id="d">Three separate layers show level-three sector memory, an added neutral ℤ₂ kink, and an even localized reader profile.</desc><defs><marker id="ta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#5c655f"/></marker></defs><rect width="1200" height="570" fill="#f6f0e6"/><g font-family="Segoe UI,Arial"><text x="58" y="58" font-size="25" font-weight="700" fill="#172321">MEMORY IS NOT A WALL; A WALL IS NOT A READER</text><text x="58" y="91" font-size="17" fill="#5c655f">Each layer has a different physical job and a different admission burden.</text><g transform="translate(55 135)"><rect width="315" height="350" rx="18" fill="#fffaf1" stroke="#b8aea0"/><text x="24" y="40" font-size="18" font-weight="700" fill="#9b6d20">1 · TOPOLOGICAL MEMORY</text><g transform="translate(158 155)" fill="none" stroke="#9b6d20" stroke-width="10"><circle r="82"/><circle r="52"/><circle r="22"/></g><g text-anchor="middle" font-size="15" font-weight="700" fill="#172321"><text x="158" y="82">sector 0</text><text x="158" y="158">sector 1</text><text x="158" y="230">sector 2</text></g><text x="158" y="285" text-anchor="middle" font-size="21" font-weight="700" fill="#9b6d20">level-three BF label</text><text x="158" y="316" text-anchor="middle" font-size="15" fill="#5c655f">remembers a sector</text><text x="158" y="338" text-anchor="middle" font-size="15" fill="#ad4d34">does not create a wall</text></g><path d="M385 310H425" stroke="#5c655f" stroke-width="4" marker-end="url(#ta)"/><text x="405" y="292" text-anchor="middle" font-size="13" fill="#5c655f">add field</text><g transform="translate(445 135)"><rect width="315" height="350" rx="18" fill="#fffaf1" stroke="#b8aea0"/><text x="24" y="40" font-size="18" font-weight="700" fill="#ad4d34">2 · NEUTRAL ℤ₂ KINK</text><path d="M35 180H280M158 70V290" stroke="#b8aea0" stroke-width="2"/><path d="M42 255C90 255 115 250 135 215C155 180 160 110 180 85C200 62 235 60 275 60" fill="none" stroke="#ad4d34" stroke-width="7"/><line x1="158" y1="65" x2="158" y2="275" stroke="#ad4d34" stroke-width="3" stroke-dasharray="7 7"/><text x="64" y="235" font-size="17" fill="#172321">−v</text><text x="248" y="82" font-size="17" fill="#172321">+v</text><text x="158" y="310" text-anchor="middle" font-size="21" font-weight="700" fill="#ad4d34">physical interface</text><text x="158" y="338" text-anchor="middle" font-size="15" fill="#5c655f">requires a separate neutral field</text></g><path d="M775 310H815" stroke="#5c655f" stroke-width="4" marker-end="url(#ta)"/><text x="795" y="292" text-anchor="middle" font-size="13" fill="#5c655f">localize</text><g transform="translate(835 135)"><rect width="315" height="350" rx="18" fill="#fffaf1" stroke="#b8aea0"/><text x="24" y="40" font-size="18" font-weight="700" fill="#1f6866">3 · GAPPED READER</text><path d="M35 230H280M158 70V270" stroke="#b8aea0" stroke-width="2"/><path d="M42 229C95 228 120 216 138 150C146 120 151 92 158 82C165 92 170 120 178 150C196 216 221 228 274 229" fill="#1f6866" opacity=".16" stroke="#1f6866" stroke-width="6"/><path d="M120 232Q158 270 196 232" fill="none" stroke="#9b6d20" stroke-width="4"/><text x="158" y="310" text-anchor="middle" font-size="21" font-weight="700" fill="#1f6866">one even localized mode</text><text x="158" y="338" text-anchor="middle" font-size="15" fill="#5c655f">dynamics live on the wall</text></g></g></svg>
