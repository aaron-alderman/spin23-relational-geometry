<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Central sign is not orientation reversal</title><desc id="d">Minus identity reverses both basis vectors and preserves oriented area, whereas a reflection reverses one basis vector and flips oriented area.</desc><rect width="1200" height="560" fill="#f6f0e6"/><g font-family="Segoe UI,Arial"><text x="60" y="58" font-size="25" font-weight="700" fill="#172321">TWO OPERATIONS THAT LOOK SIMILAR—BUT ARE NOT</text><text x="60" y="92" font-size="17" fill="#5c655f">Orientation follows the determinant, not the number of minus signs in a label.</text><g transform="translate(55 130)"><rect width="520" height="370" rx="18" fill="#fffaf1" stroke="#b8aea0"/><text x="28" y="42" font-size="19" font-weight="700" fill="#1f6866">CENTRAL SIGN: −I₂</text><path d="M150 230V105M150 230H275" stroke="#1f6866" stroke-width="7"/><path d="M150 230V335M150 230H45" stroke="#ad4d34" stroke-width="7"/><g font-size="16" font-weight="700"><text x="160" y="100" fill="#1f6866">e₂</text><text x="280" y="248" fill="#1f6866">e₁</text><text x="35" y="248" fill="#ad4d34">−e₁</text><text x="165" y="325" fill="#ad4d34">−e₂</text></g><text x="350" y="125" font-size="30" fill="#172321">[−1  0]</text><text x="350" y="162" font-size="30" fill="#172321">[ 0 −1]</text><text x="350" y="225" font-size="23" font-weight="700" fill="#1f6866">det = +1</text><text x="350" y="270" font-size="17" fill="#172321">two axis reversals</text><text x="350" y="300" font-size="17" fill="#172321">preserve e₁∧e₂</text><text x="260" y="345" text-anchor="middle" font-size="19" font-weight="700" fill="#1f6866">orientation preserved</text></g><g transform="translate(625 130)"><rect width="520" height="370" rx="18" fill="#fffaf1" stroke="#b8aea0"/><text x="28" y="42" font-size="19" font-weight="700" fill="#ad4d34">REFLECTION: R</text><path d="M150 230V105M150 230H275" stroke="#1f6866" stroke-width="7"/><path d="M150 230H45" stroke="#ad4d34" stroke-width="7"/><g font-size="16" font-weight="700"><text x="160" y="100" fill="#1f6866">e₂</text><text x="280" y="248" fill="#1f6866">e₁</text><text x="35" y="248" fill="#ad4d34">−e₁</text></g><text x="350" y="125" font-size="30" fill="#172321">[−1  0]</text><text x="350" y="162" font-size="30" fill="#172321">[ 0  +1]</text><text x="350" y="225" font-size="23" font-weight="700" fill="#ad4d34">det = −1</text><text x="350" y="270" font-size="17" fill="#172321">one axis reversal</text><text x="350" y="300" font-size="17" fill="#172321">flips e₁∧e₂</text><text x="260" y="345" text-anchor="middle" font-size="19" font-weight="700" fill="#ad4d34">orientation reversed</text></g></g></svg>
