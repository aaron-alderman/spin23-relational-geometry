name: Publish Edition 3 book

on:
  push:
    branches: [main]
    paths:
      - "corpus/**"
      - "docs/concept-map/**"
      - "book/edition-3/**"
      - "tooling/publication/**"
      - "tests/publication/**"
      - ".github/workflows/publish-edition-3-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the corpus
        uses: actions/checkout@v5

      - name: Assemble the disposable Pages artifact
        run: |
          mkdir -p .build/pages
          cp -R docs/concept-map .build/pages/concept-map
          node tooling/publication/generate_edition3_book_preview.mjs --site-only --site-root .build/pages/edition-3

      - name: Enforce the authority boundary
        run: |
          git diff --exit-code -- book/edition-3 corpus
          test -z "$(git ls-files docs/edition-3 docs/index.html)"

      - name: Test the publication surfaces
        env:
          EDITION3_SITE_ROOT: .build/pages/edition-3
        run: |
          node --test tests/publication/edition3_book_preview.test.mjs
          node --test tests/publication/edition3_compiled_site.test.mjs
          node --test tests/publication/concept_map.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static book
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/pages

      - name: Deploy the book
        id: deployment
        uses: actions/deploy-pages@v4
