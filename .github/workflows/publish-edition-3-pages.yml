name: Publish Edition 3 book

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publish-edition-3-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Free cannot publish Pages from this private repository. Pushes become
    # eligible automatically if it is made public; an eligible paid plan can use
    # the manual dispatch path without another workflow edit.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the corpus
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static book
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy the book
        id: deployment
        uses: actions/deploy-pages@v4
