name: Publish Edition 3 book

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "book/edition-3/**"
      - "tooling/publication/**"
      - "tests/publication/**"
      - ".github/workflows/publish-edition-3-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the corpus
        uses: actions/checkout@v5

      - name: Regenerate the static book
        run: node tooling/publication/generate_edition3_book_preview.mjs

      - name: Verify generated files are committed
        run: git diff --exit-code -- book/edition-3 docs/edition-3 docs/index.html

      - name: Test the publication surfaces
        run: |
          node --test tests/publication/edition3_book_preview.test.mjs
          node --test tests/publication/concept_map.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static book
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy the book
        id: deployment
        uses: actions/deploy-pages@v4
